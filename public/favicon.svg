<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Fundo Slate-950 com borda suave -->
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#1e293b" stroke-width="8"/>

  <!-- Texto <Ohashi/> com Gradiente Azul/Verde -->
  <text
    x="50%"
    y="52%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-weight="900"
    font-size="78"
    letter-spacing="-3"
    fill="url(#ohashi-gradient)"
  >
    &lt;Ohashi/&gt;
  </text>

  <defs>
    <linearGradient id="ohashi-gradient" x1="30" y1="256" x2="482" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
</svg>
